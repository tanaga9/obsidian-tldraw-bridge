[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-tldraw-bridge"
version = "0.1.0"
description = "Local CLI for live Obsidian tldraw diagrams"
requires-python = ">=3.10"

[project.scripts]
obsidian-tldraw = "obsidian_tldraw_bridge.cli:main"

[tool.setuptools.package-data]
obsidian_tldraw_bridge = ["runtime/*.cjs"]
